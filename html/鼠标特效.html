<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鼠标跟随轨迹特效</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", -apple-system, "Segoe UI", sans-serif;
      /* 登录页主背景：深蓝 #032690 渐变，营造科技氛围 */
      background:
        radial-gradient(circle at 20% 20%, #0a3fb8 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, #021a60 0%, transparent 55%),
        linear-gradient(135deg, #032690 0%, #021a60 100%);
      color: #fff;
      cursor: url('cursor4.png') 0 0, auto;
    }

    /* 特效画布：覆盖全屏，置底 */
    #trailCanvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }


    /* 背景装饰光斑，增强氛围 */
    .bg-decor {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-decor span {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80, 191, 255, .25), transparent 70%);
      filter: blur(20px);
      animation: floatBlob 14s ease-in-out infinite;
    }
    .bg-decor span:nth-child(1) { width: 360px; height: 360px; left: -80px; top: -80px; animation-delay: 0s; }
    .bg-decor span:nth-child(2) { width: 280px; height: 280px; right: -60px; top: 30%; animation-delay: -4s; }
    .bg-decor span:nth-child(3) { width: 320px; height: 320px; left: 20%; bottom: -100px; animation-delay: -8s; }
    @keyframes floatBlob {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -40px) scale(1.08); }
    }

    /* 右上角：特效指示器 */
    .effect-panel {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 5;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(8, 60, 170, .4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(120, 180, 255, .25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
      min-width: 200px;
      user-select: none;
    }
    .effect-panel .ep-title {
      font-size: 12px;
      color: #9fb8e0;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }
    .effect-panel .ep-name {
      font-size: 16px;
      font-weight: 600;
      color: #4FC3F7;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .effect-panel .ep-name .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4FC3F7;
      box-shadow: 0 0 10px #4FC3F7;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.7); }
    }
    .effect-panel .ep-list {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .effect-panel .ep-list span {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      color: #9fb8e0;
      background: rgba(3, 38, 144, .4);
      border: 1px solid rgba(120, 180, 255, .15);
      transition: all .2s;
    }
    .effect-panel .ep-list span.active {
      color: #fff;
      background: linear-gradient(135deg, #2196F3, #1565C0);
      border-color: #4FC3F7;
      box-shadow: 0 0 10px rgba(79, 195, 247, .5);
    }

    /* 左下角提示 */
    .hint {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 5;
      font-size: 12px;
      color: #9fb8e0;
      letter-spacing: 1px;
      user-select: none;
    }
    .hint kbd {
      display: inline-block;
      padding: 2px 8px;
      margin: 0 3px;
      font-size: 11px;
      color: #4FC3F7;
      background: rgba(3, 38, 144, .5);
      border: 1px solid rgba(120, 180, 255, .3);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <!-- 背景装饰光斑 -->
  <div class="bg-decor">
    <span></span><span></span><span></span>
  </div>

  <!-- 特效画布 -->
  <canvas id="trailCanvas"></canvas>

  <!-- 特效指示面板 -->
  <div class="effect-panel">
    <div class="ep-title">当前特效</div>
    <div class="ep-name"><span class="dot"></span><span id="epName">粒子拖尾</span></div>
    <div class="ep-list" id="epList"></div>
  </div>

  <!-- 操作提示 -->
  <div class="hint">点击页面空白处<kbd>切换</kbd>下一种特效，共 <kbd>10</kbd> 种</div>

  <script>
  (function () {
    /* ===================== 基础初始化 ===================== */
    const canvas = document.getElementById('trailCanvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    // 鼠标状态
    const mouse = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, down: false, moved: false };
    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.moved = true;
    });
    window.addEventListener('mousedown', () => mouse.down = true);
    window.addEventListener('mouseup', () => mouse.down = false);

    // 工具函数
    const rand = (a, b) => a + Math.random() * (b - a);
    const TAU = Math.PI * 2;

    /* ===================== 10 个特效定义 ===================== */
    // 每个特效包含: name(名称), init(初始化), step(每帧更新+绘制, 接收 dt)
    const effects = [];

    /* ---------- 1. 粒子拖尾 Particle Trail ---------- */
    effects.push({
      name: '粒子拖尾',
      particles: [],
      init() { this.particles = []; },
      step(dt) {
        // 产生新粒子
        if (mouse.moved || mouse.down) {
          for (let i = 0; i < 3; i++) {
            this.particles.push({
              x: mouse.x + rand(-2, 2),
              y: mouse.y + rand(-2, 2),
              vx: rand(-0.6, 0.6),
              vy: rand(-0.6, 0.6),
              life: 1,
              size: rand(2, 4.5),
              hue: rand(190, 215)
            });
          }
        }
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx; p.y += p.vy;
          p.life -= 0.018;
          if (p.life <= 0) { this.particles.splice(i, 1); continue; }
          const r = p.size * p.life;
          const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
          g.addColorStop(0, `hsla(${p.hue}, 100%, 40%, ${p.life * 0.3})`);
          g.addColorStop(0.4, `hsla(${p.hue}, 100%, 35%, ${p.life * 0.15})`);
          g.addColorStop(1, `hsla(${p.hue}, 100%, 30%, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r * 4, 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ---------- 2. 光晕呼吸 Glow Pulse ---------- */
    effects.push({
      name: '光晕呼吸',
      t: 0,
      cx: 0, cy: 0,
      init() { this.t = 0; this.cx = mouse.x; this.cy = mouse.y; },
      step(dt) {
        this.t += dt;
        // 缓动跟随
        this.cx += (mouse.x - this.cx) * 0.15;
        this.cy += (mouse.y - this.cy) * 0.15;
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        const pulse = 0.7 + Math.sin(this.t * 0.005) * 0.3;
        // 多层光晕
        for (let i = 3; i >= 1; i--) {
          const r = (30 + i * 25) * pulse;
          const g = ctx.createRadialGradient(this.cx, this.cy, 0, this.cx, this.cy, r);
          g.addColorStop(0, `rgba(120, 200, 255, ${0.18 / i})`);
          g.addColorStop(0.5, `rgba(60, 140, 255, ${0.08 / i})`);
          g.addColorStop(1, 'rgba(30, 80, 200, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(this.cx, this.cy, r, 0, TAU);
          ctx.fill();
        }
        // 中心亮点
        const cg = ctx.createRadialGradient(this.cx, this.cy, 0, this.cx, this.cy, 8);
        cg.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
        cg.addColorStop(1, 'rgba(150, 220, 255, 0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(this.cx, this.cy, 8, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ---------- 3. 星光闪烁 Star Sparkle ---------- */
    effects.push({
      name: '星光闪烁',
      stars: [],
      init() { this.stars = []; },
      step(dt) {
        if (mouse.moved) {
          for (let i = 0; i < 2; i++) {
            this.stars.push({
              x: mouse.x + rand(-10, 10),
              y: mouse.y + rand(-10, 10),
              life: 1,
              size: rand(6, 14),
              rot: rand(0, TAU),
              vr: rand(-0.08, 0.08),
              hue: rand(180, 210)
            });
          }
        }
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = this.stars.length - 1; i >= 0; i--) {
          const s = this.stars[i];
          s.life -= 0.022;
          s.rot += s.vr;
          if (s.life <= 0) { this.stars.splice(i, 1); continue; }
          const scale = s.life * (1 + Math.sin(s.life * 10) * 0.15);
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          ctx.scale(scale, scale);
          // 十字星光
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s.size);
          g.addColorStop(0, `hsla(${s.hue}, 100%, 90%, ${s.life})`);
          g.addColorStop(1, `hsla(${s.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          // 四角星
          for (let k = 0; k < 4; k++) {
            const a = k * Math.PI / 2;
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * s.size, Math.sin(a) * s.size);
            ctx.lineTo(Math.cos(a + 0.3) * s.size * 0.3, Math.sin(a + 0.3) * s.size * 0.3);
          }
          // 用线条画十字光
          ctx.strokeStyle = `hsla(${s.hue}, 100%, 85%, ${s.life})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-s.size, 0); ctx.lineTo(s.size, 0);
          ctx.moveTo(0, -s.size); ctx.lineTo(0, s.size);
          ctx.stroke();
          // 中心点
          ctx.fillStyle = `hsla(${s.hue}, 100%, 95%, ${s.life})`;
          ctx.beginPath();
          ctx.arc(0, 0, 2, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ---------- 4. 水波纹 Ripple Wave ---------- */
    effects.push({
      name: '水波纹',
      ripples: [],
      timer: 0,
      init() { this.ripples = []; this.timer = 0; },
      step(dt) {
        this.timer += dt;
        if (this.timer > 90) {
          this.timer = 0;
          this.ripples.push({ x: mouse.x, y: mouse.y, r: 0, life: 1 });
        }
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = this.ripples.length - 1; i >= 0; i--) {
          const r = this.ripples[i];
          r.r += 2.2;
          r.life -= 0.012;
          if (r.life <= 0) { this.ripples.splice(i, 1); continue; }
          // 双层环
          ctx.strokeStyle = `rgba(120, 200, 255, ${r.life * 0.6})`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r, 0, TAU);
          ctx.stroke();
          ctx.strokeStyle = `rgba(180, 230, 255, ${r.life * 0.35})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.r * 0.7, 0, TAU);
          ctx.stroke();
        }
        // 光标处亮点
        const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 12);
        g.addColorStop(0, 'rgba(200, 230, 255, 0.9)');
        g.addColorStop(1, 'rgba(120, 200, 255, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 12, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ---------- 5. 流光剑影 Light Trail ---------- */
    effects.push({
      name: '流光剑影',
      points: [],
      init() { this.points = []; },
      step(dt) {
        // 记录轨迹点
        this.points.push({ x: mouse.x, y: mouse.y, life: 1 });
        if (this.points.length > 50) this.points.shift();
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        // 衰减
        for (let i = 0; i < this.points.length; i++) this.points[i].life -= 0.02;
        // 绘制平滑轨迹
        const pts = this.points;
        if (pts.length > 2) {
          const last = pts[pts.length - 1];
          for (let layer = 0; layer < 3; layer++) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length - 1; i++) {
              const xc = (pts[i].x + pts[i + 1].x) / 2;
              const yc = (pts[i].y + pts[i + 1].y) / 2;
              ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
            }
            ctx.lineTo(last.x, last.y);
            const width = (12 - layer * 4);
            const alpha = (0.85 - layer * 0.25);
            ctx.strokeStyle = layer === 0
              ? `rgba(255, 255, 255, ${alpha})`
              : `rgba(100, 180, 255, ${alpha})`;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = '#4FC3F7';
            ctx.shadowBlur = 18 - layer * 5;
            ctx.stroke();
          }
          ctx.shadowBlur = 0;
          // 末端光球
          const g = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, 18);
          g.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
          g.addColorStop(0.4, 'rgba(120, 200, 255, 0.6)');
          g.addColorStop(1, 'rgba(60, 140, 255, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(last.x, last.y, 18, 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ---------- 6. 萤火虫舞 Firefly Dance ---------- */
    effects.push({
      name: '萤火虫舞',
      flies: [],
      init() { this.flies = []; },
      step(dt) {
        if ((mouse.moved || Math.random() < 0.05) && this.flies.length < 60) {
          this.flies.push({
            x: mouse.x + rand(-15, 15),
            y: mouse.y + rand(-15, 15),
            tx: mouse.x + rand(-80, 80),
            ty: mouse.y + rand(-80, 80),
            life: 1,
            size: rand(1.5, 3),
            phase: rand(0, TAU),
            hue: rand(40, 60) // 暖黄萤光，与蓝背景形成对比点缀
          });
        }
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = this.flies.length - 1; i >= 0; i--) {
          const f = this.flies[i];
          // 缓动飘向目标
          f.x += (f.tx - f.x) * 0.02;
          f.y += (f.ty - f.y) * 0.02;
          // 偶尔换目标
          if (Math.random() < 0.01) {
            f.tx = mouse.x + rand(-100, 100);
            f.ty = mouse.y + rand(-100, 100);
          }
          f.life -= 0.004;
          f.phase += 0.08;
          if (f.life <= 0) { this.flies.splice(i, 1); continue; }
          const blink = 0.5 + Math.sin(f.phase) * 0.5;
          const r = f.size * (1 + blink * 0.5);
          const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r * 6);
          g.addColorStop(0, `hsla(${f.hue}, 100%, 80%, ${f.life * blink})`);
          g.addColorStop(0.3, `hsla(${f.hue}, 100%, 60%, ${f.life * blink * 0.4})`);
          g.addColorStop(1, `hsla(${f.hue}, 100%, 50%, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(f.x, f.y, r * 6, 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ---------- 7. 花瓣飘落 Petal Drift ---------- */
    effects.push({
      name: '花瓣飘落',
      petals: [],
      init() { this.petals = []; },
      step(dt) {
        if (mouse.moved) {
          for (let i = 0; i < 2; i++) {
            this.petals.push({
              x: mouse.x + rand(-8, 8),
              y: mouse.y + rand(-8, 8),
              vx: rand(-0.8, 0.8),
              vy: rand(0.3, 1.2),
              life: 1,
              size: rand(6, 12),
              rot: rand(0, TAU),
              vr: rand(-0.05, 0.05),
              sway: rand(0, TAU),
              hue: rand(195, 215)
            });
          }
        }
        ctx.clearRect(0, 0, W, H);
        for (let i = this.petals.length - 1; i >= 0; i--) {
          const p = this.petals[i];
          p.sway += 0.05;
          p.x += p.vx + Math.sin(p.sway) * 0.6;
          p.y += p.vy;
          p.rot += p.vr;
          p.life -= 0.006;
          if (p.life <= 0 || p.y > H + 20) { this.petals.splice(i, 1); continue; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          // 花瓣形状（椭圆 + 渐变）
          const g = ctx.createLinearGradient(0, -p.size, 0, p.size);
          g.addColorStop(0, `hsla(${p.hue}, 100%, 80%, ${p.life * 0.9})`);
          g.addColorStop(1, `hsla(${p.hue}, 100%, 55%, ${p.life * 0.3})`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size * 0.45, p.size, 0, 0, TAU);
          ctx.fill();
          // 高光
          ctx.fillStyle = `hsla(${p.hue}, 100%, 95%, ${p.life * 0.4})`;
          ctx.beginPath();
          ctx.ellipse(-p.size * 0.1, -p.size * 0.3, p.size * 0.15, p.size * 0.4, 0, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }
    });

    /* ---------- 8. 电流弧光 Lightning Arc ---------- */
    effects.push({
      name: '电流弧光',
      arcs: [],
      timer: 0,
      init() { this.arcs = []; this.timer = 0; },
      step(dt) {
        this.timer += dt;
        if (this.timer > 40 && mouse.moved) {
          this.timer = 0;
          // 生成一条弧光
          const segs = 8;
          const pts = [{ x: mouse.x, y: mouse.y }];
          const ang = rand(0, TAU);
          const len = rand(40, 90);
          for (let i = 1; i <= segs; i++) {
            const t = i / segs;
            pts.push({
              x: mouse.x + Math.cos(ang) * len * t + rand(-12, 12),
              y: mouse.y + Math.sin(ang) * len * t + rand(-12, 12)
            });
          }
          this.arcs.push({ pts, life: 1, branches: this.makeBranches(pts) });
        }
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = this.arcs.length - 1; i >= 0; i--) {
          const a = this.arcs[i];
          a.life -= 0.08;
          if (a.life <= 0) { this.arcs.splice(i, 1); continue; }
          // 主弧
          ctx.strokeStyle = `rgba(180, 220, 255, ${a.life})`;
          ctx.lineWidth = 2;
          ctx.shadowColor = '#4FC3F7';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(a.pts[0].x, a.pts[0].y);
          for (let j = 1; j < a.pts.length; j++) ctx.lineTo(a.pts[j].x, a.pts[j].y);
          ctx.stroke();
          // 内核白线
          ctx.strokeStyle = `rgba(255, 255, 255, ${a.life})`;
          ctx.lineWidth = 0.8;
          ctx.shadowBlur = 0;
          ctx.stroke();
          // 分支
          ctx.strokeStyle = `rgba(150, 200, 255, ${a.life * 0.6})`;
          ctx.lineWidth = 1;
          for (const b of a.branches) {
            ctx.beginPath();
            ctx.moveTo(b[0].x, b[0].y);
            for (let j = 1; j < b.length; j++) ctx.lineTo(b[j].x, b[j].y);
            ctx.stroke();
          }
        }
        ctx.shadowBlur = 0;
        // 光标处电球
        const g = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 14);
        g.addColorStop(0, 'rgba(220, 240, 255, 0.9)');
        g.addColorStop(0.5, 'rgba(100, 180, 255, 0.4)');
        g.addColorStop(1, 'rgba(60, 140, 255, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 14, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      },
      makeBranches(pts) {
        const branches = [];
        for (let i = 1; i < pts.length - 1; i++) {
          if (Math.random() < 0.35) {
            const b = [pts[i]];
            let bx = pts[i].x, by = pts[i].y;
            const seg = 3;
            for (let k = 0; k < seg; k++) {
              bx += rand(-15, 15);
              by += rand(-15, 15);
              b.push({ x: bx, y: by });
            }
            branches.push(b);
          }
        }
        return branches;
      }
    });

    /* ---------- 9. 星河漩涡 Galaxy Spiral ---------- */
    effects.push({
      name: '星河漩涡',
      stars: [],
      angle: 0,
      init() { this.stars = []; this.angle = 0; },
      step(dt) {
        this.angle += 0.03;
        // 持续补充
        if (this.stars.length < 80) {
          this.stars.push({
            r: rand(0, 80),
            a: rand(0, TAU),
            life: 1,
            size: rand(1, 2.5),
            hue: rand(200, 260), // 蓝-紫星河
            speed: rand(0.02, 0.05)
          });
        }
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = this.stars.length - 1; i >= 0; i--) {
          const s = this.stars[i];
          s.a += s.speed;
          s.r += 0.4;
          s.life -= 0.006;
          if (s.life <= 0) { this.stars.splice(i, 1); continue; }
          const x = mouse.x + Math.cos(s.a + this.angle * 0.2) * s.r;
          const y = mouse.y + Math.sin(s.a + this.angle * 0.2) * s.r;
          // 拖尾
          const tx = mouse.x + Math.cos(s.a + this.angle * 0.2 - 0.3) * (s.r - 6);
          const ty = mouse.y + Math.sin(s.a + this.angle * 0.2 - 0.3) * (s.r - 6);
          ctx.strokeStyle = `hsla(${s.hue}, 100%, 75%, ${s.life * 0.5})`;
          ctx.lineWidth = s.size * 0.6;
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(x, y);
          ctx.stroke();
          // 星点
          const g = ctx.createRadialGradient(x, y, 0, x, y, s.size * 4);
          g.addColorStop(0, `hsla(${s.hue}, 100%, 90%, ${s.life})`);
          g.addColorStop(1, `hsla(${s.hue}, 100%, 60%, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, s.size * 4, 0, TAU);
          ctx.fill();
        }
        // 中心黑洞光晕
        const cg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 25);
        cg.addColorStop(0, 'rgba(200, 220, 255, 0.5)');
        cg.addColorStop(0.5, 'rgba(100, 150, 255, 0.2)');
        cg.addColorStop(1, 'rgba(60, 100, 200, 0)');
        ctx.fillStyle = cg;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 25, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ---------- 10. 泡泡升腾 Bubble Rise ---------- */
    effects.push({
      name: '泡泡升腾',
      bubbles: [],
      init() { this.bubbles = []; },
      step(dt) {
        if ((mouse.moved || Math.random() < 0.1) && this.bubbles.length < 100) {
          this.bubbles.push({
            x: mouse.x + rand(-15, 15),
            y: mouse.y + rand(-15, 15),
            vx: rand(-0.4, 0.4),
            vy: rand(-1.2, -0.6),
            life: 1,
            size: rand(5, 14),
            sway: rand(0, TAU),
            hue: rand(190, 210)
          });
        }
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = this.bubbles.length - 1; i >= 0; i--) {
          const b = this.bubbles[i];
          b.sway += 0.04;
          b.x += b.vx + Math.sin(b.sway) * 0.4;
          b.y += b.vy;
          b.life -= 0.012;
          if (b.life <= 0 || b.y < -20) { this.bubbles.splice(i, 1); continue; }
          // 泡泡主体
          const g = ctx.createRadialGradient(b.x - b.size * 0.3, b.y - b.size * 0.3, 0, b.x, b.y, b.size);
          g.addColorStop(0, `hsla(${b.hue}, 100%, 90%, ${b.life * 0.5})`);
          g.addColorStop(0.7, `hsla(${b.hue}, 100%, 60%, ${b.life * 0.15})`);
          g.addColorStop(1, `hsla(${b.hue}, 100%, 50%, 0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.size, 0, TAU);
          ctx.fill();
          // 描边
          ctx.strokeStyle = `hsla(${b.hue}, 100%, 80%, ${b.life * 0.4})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.size, 0, TAU);
          ctx.stroke();
          // 高光
          ctx.fillStyle = `rgba(255, 255, 255, ${b.life * 0.6})`;
          ctx.beginPath();
          ctx.arc(b.x - b.size * 0.35, b.y - b.size * 0.35, b.size * 0.2, 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    });

    /* ===================== 切换控制 ===================== */
    let current = 0;
    effects[current].init();

    const epName = document.getElementById('epName');
    const epList = document.getElementById('epList');
    // 构建指示列表
    effects.forEach((e, i) => {
      const span = document.createElement('span');
      span.textContent = (i + 1) + ' ' + e.name;
      span.dataset.idx = i;
      epList.appendChild(span);
    });

    function updatePanel() {
      epName.textContent = effects[current].name;
      [...epList.children].forEach((c, i) => {
        c.classList.toggle('active', i === current);
      });
    }
    updatePanel();

    // 点击切换：点击空白处或面板列表项均可
    function switchTo(idx) {
      current = (idx + effects.length) % effects.length;
      effects[current].init();
      updatePanel();
    }

    document.addEventListener('click', e => {
      // 命中面板里的标签 → 跳转到指定
      const tag = e.target.closest('#epList span');
      if (tag) { switchTo(+tag.dataset.idx); return; }
      // 点击特效面板本体 → 不切换，避免误触
      if (e.target.closest('.effect-panel')) return;
      // 其余空白处 → 下一个
      switchTo(current + 1);
    });

    // 键盘左右切换
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') switchTo(current + 1);
      if (e.key === 'ArrowLeft') switchTo(current - 1);
    });

    /* ===================== 主循环 ===================== */
    let last = performance.now();
    function loop(now) {
      const dt = now - last;
      last = now;
      effects[current].step(dt);
      mouse.moved = false; // 每帧重置移动标记
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
